<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>FlyGidi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FAC206; --black: #000000; --white: #FFFFFF; --grey: #6B6E73;
    --green: #008751; --red: #E0322B;
    --bg: #000000; --ink: #FFFFFF;
    --cond: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000000; --ink: #FFFFFF; } }
  :root[data-theme="dark"] { --bg: #000000; --ink: #FFFFFF; }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { height: 100%; font-family: "Barlow", Arial, Helvetica, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: relative; height: 100%; max-width: 480px; margin: 0 auto; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  button { font: inherit; }
  button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

  .hud[hidden], .newbest[hidden], .screen[hidden], .unlockmsg[hidden] { display: none; }
  .hud { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 14px; pointer-events: none; }
  .score { font-family: var(--cond); font-weight: 700; font-size: 40px; line-height: 1; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.55); font-variant-numeric: tabular-nums; }
  .sub { font-family: var(--cond); font-weight: 600; font-size: 16px; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.7); }
  .mult { display: inline-block; margin-top: 6px; background: var(--yellow); color: #000; font-family: var(--cond); font-weight: 700; font-size: 18px; padding: 2px 8px; border-radius: 6px; }
  .hudbtns { display: flex; gap: 8px; }
  .iconbtn { pointer-events: auto; width: 44px; height: 44px; border-radius: 10px; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }

  .toast { position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%); font-family: var(--cond); font-style: italic; font-weight: 800; font-size: 30px; color: #fff; text-shadow: 0 2px 0 #000; pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap; }
  .toast.show { opacity: 1; }

  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 24px 20px 28px; background: rgba(0,0,0,.82); overflow-y: auto; touch-action: pan-y; }
  .screen.center { justify-content: center; }
  .screen > * { flex-shrink: 0; }
  .logo { width: min(260px, 72%); height: auto; display: block; margin: 4px 0 10px; }
  .tag { font-family: var(--cond); font-style: italic; font-weight: 800; font-size: 28px; line-height: 1.05; margin: 0 0 18px; color: var(--yellow); }
  .label { margin: 0 0 8px; font-family: var(--cond); font-weight: 700; font-size: 17px; color: #fff; }
  .note { margin: 6px 0 16px; color: #cfcfcf; font-size: 14px; line-height: 1.45; min-height: 1.45em; }

  .routes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .route { text-align: left; padding: 10px 12px; min-height: 64px; border-radius: 10px; border: 2px solid rgba(255,255,255,.85); background: transparent; color: #fff; cursor: pointer; }
  .route b { display: block; font-family: var(--cond); font-weight: 700; font-size: 18px; line-height: 1.1; }
  .route span { display: block; font-size: 12px; color: #cfcfcf; margin-top: 3px; }
  .route[aria-pressed="true"] { background: #fff; color: #000; }
  .route[aria-pressed="true"] span { color: #444; }
  .route.locked { border-style: dashed; opacity: .7; }

  .seg { display: grid; gap: 8px; }
  .seg.three { grid-template-columns: repeat(3, 1fr); }
  .seg.two { grid-template-columns: repeat(2, 1fr); }
  .opt { min-height: 46px; border-radius: 10px; border: 2px solid #fff; background: transparent; color: #fff; font-family: var(--cond); font-weight: 700; font-size: 18px; cursor: pointer; }
  .opt[aria-pressed="true"] { background: #fff; color: #000; }

  .btn { display: block; width: 100%; min-height: 54px; border-radius: 10px; font-family: var(--cond); font-weight: 700; font-size: 20px; letter-spacing: .02em; cursor: pointer; }
  .btn.primary { background: var(--yellow); color: #000; border: 0; }
  .btn.primary:disabled { background: #5a5a5a; color: #bdbdbd; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: #fff; border: 2px solid #fff; margin-top: 12px; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; }
  .how { margin: 0; color: #bdbdbd; font-size: 13px; line-height: 1.5; }
  .link { background: none; border: 0; color: #bdbdbd; text-decoration: underline; font-size: 12px; padding: 6px 0; cursor: pointer; white-space: nowrap; }
  .soundbtn { background: none; border: 2px solid #fff; color: #fff; border-radius: 10px; padding: 8px 12px; font-family: var(--cond); font-weight: 700; font-size: 16px; cursor: pointer; white-space: nowrap; }

  .big { font-family: var(--cond); font-weight: 700; font-size: 72px; line-height: 1; margin: 0; font-variant-numeric: tabular-nums; }
  .crash { font-family: var(--cond); font-style: italic; font-weight: 800; font-size: 30px; line-height: 1.1; margin: 0 0 16px; color: var(--yellow); }
  .meta { color: #cfcfcf; font-size: 14px; margin: 0 0 6px; }
  .row { display: flex; gap: 22px; margin: 10px 0 20px; flex-wrap: wrap; }
  .row div span { display: block; color: #bdbdbd; font-size: 13px; }
  .row div b { font-family: var(--cond); font-size: 26px; font-weight: 700; }
  .newbest, .unlockmsg { align-self: flex-start; display: inline-block; background: var(--green); color: #fff; font-family: var(--cond); font-weight: 700; font-size: 16px; padding: 3px 10px; border-radius: 6px; margin-bottom: 10px; }
  .unlockmsg { background: var(--yellow); color: #000; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" aria-label="FlyGidi racing game"></canvas>

  <div class="hud" id="hud" hidden>
    <div>
      <div class="score" id="score">0</div>
      <div class="sub" id="best">Best 0</div>
      <div class="mult" id="mult">x1</div>
    </div>
    <div class="hudbtns">
      <button class="iconbtn" id="muteBtn" aria-label="Sound off">♪</button>
      <button class="iconbtn" id="pauseBtn" aria-label="Pause">II</button>
    </div>
  </div>
  <div class="toast" id="toast" aria-live="polite"></div>

    $('soundToggle').textContent = soundOn ? 'Sound on' : 'Sound off';
    $('muteBtn').textContent = soundOn ? '♪' : '×';
    $('muteBtn').setAttribute('aria-label', soundOn ? 'Turn sound off' : 'Turn sound on');
    $('testerBtn').hidden = testerUnlock;
  }
  document.querySelectorAll('[data-level]').forEach(b => b.addEventListener('click', () => { level = b.dataset.level; store.set('flygidi_level', level); renderMenu(); }));
  document.querySelectorAll('[data-veh]').forEach(b => b.addEventListener('click', () => { vehicle = b.dataset.veh; store.set('flygidi_vehicle', vehicle); reset(); renderMenu(); }));
  function toggleSound() { soundOn = !soundOn; store.set('flygidi_sound', soundOn); Sound.setOn(soundOn); renderMenu(); }
  $('soundToggle').onclick = toggleSound;
  $('muteBtn').onclick = toggleSound;
  $('testerBtn').onclick = () => { testerUnlock = true; store.set('flygidi_tester_unlock', true); renderMenu(); };

  const show = (id) => { ['start', 'paused', 'over'].forEach(s => $(s).hidden = s !== id); $('hud').hidden = !(id === null || id === 'paused'); };
  let unlockedBefore = [];
  function startGame() {
    if (!isUnlocked(route)) return;
    Sound.init(); Sound.resume();
    unlockedBefore = ROUTE_ORDER.filter(isUnlocked);
    reset(); state = 'play'; show(null); last = performance.now();
    Sound.horn(); Sound.engineStart();
  }
  function togglePause() {
    if (state === 'play') { state = 'pause'; show('paused'); Sound.engineStop(); }
    else if (state === 'pause') { state = 'play'; show(null); last = performance.now(); Sound.resume(); Sound.engineStart(); }
  }
  $('startBtn').onclick = startGame;
  $('againBtn').onclick = startGame;
  $('pauseBtn').onclick = togglePause;
  $('resumeBtn').onclick = togglePause;
  $('quitBtn').onclick = () => { state = 'play'; crash(null, true); };
  $('menuBtn').onclick = () => { state = 'menu'; reset(); renderMenu(); show('start'); $('start').scrollTop = 0; };
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

  const CRASH_LINES = {
    car: ['Oga, face your front o.', 'Small space no be road.'],
    danfo: ['Danfo no dey look road o.', 'Conductor don shout "Owa!"'],
    bus: ['BRT no dey shift for anybody.', 'That bus long pass your patience.'],
    keke: ['Keke don cut you again.', 'Keke drivers no dey indicate.'],
    okada: ['Okada don enter your lane again.', 'Okada no send anybody.'],
    breakdown: ['Breakdown for middle road. Na Lagos.', 'Hazard sign no be decoration o.'],
    barrier: ['Toll gate no dey open for you o.', 'Na the green lane you suppose follow.'],
    hawker: ['Give way! People dey cross.', 'Slow down, hawker get right of way.'],
    crosser: ['Junction no be racetrack o.', 'That car no see you, and you no see am.'],
    convoy: ['Siren no be music. Clear road next time.', 'Convoy no dey wait for anybody.'],
    pothole: ['Pothole don throw you comot.', 'Powerbike and pothole no be friends.'],
    works: ['Road works no be shortcut.', 'Those cones dey there for a reason.'],
    quit: ['Race ended. The road will wait for you.']
  };
  function crash(o, quit) {
    state = 'over';
    Sound.engineStop();
    if (!quit) Sound.crash();
    const lines = CRASH_LINES[quit ? 'quit' : o.kind] || CRASH_LINES.car;
    $('crashLine').textContent = pick(lines);
    const s = Math.floor(score);
    const isBest = s > best;
    if (isBest) { best = s; store.set(bestKey(route, level), best); }
    $('newBest').hidden = !isBest || s === 0;
    const nowOpen = ROUTE_ORDER.filter(isUnlocked).filter(r => !unlockedBefore.includes(r));
    if (nowOpen.length) { $('unlockMsg').textContent = 'New route unlocked: ' + ROUTES[nowOpen[0]].name; $('unlockMsg').hidden = false; setTimeout(() => Sound.unlock(), 500); }
    else $('unlockMsg').hidden = true;
    $('overMeta').textContent = ROUTES[route].name + ', ' + LEVELS[level].label + ', ' + VEHICLES[vehicle].label;
    $('finalScore').textContent = fmt(s);
    $('finalBestLabel').textContent = LEVELS[level].label + ' best';
    $('finalBest').textContent = fmt(best);
    $('finalDist').textContent = fmt(dist / 10) + ' m';
    $('finalPassed').textContent = passed;
    shake = quit ? 0 : 14;
    setTimeout(() => { show('over'); $('over').scrollTop = 0; }, quit ? 0 : 450);
  }

  let toastTimer;
  function toast(msg) {
    const el = $('toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 900);
  }
  function updateHud() {
    $('score').textContent = fmt(score);
    $('best').textContent = LEVELS[level].label + ' best ' + fmt(best);
    $('mult').textContent = 'x' + mult;
  }

  // ---------- update ----------
  function update(dt) {
    t += dt;
    const LV = LEVELS[level], R = ROUTES[route];
    const VH = VEHICLES[vehicle];
    speed = Math.min(LV.max * R.speed, (LV.start + t * LV.accel) * R.speed) * (VH.speed || 1);
    Sound.engineSet(speed);
    const dy = speed * dt;
    dist += dy;
    score += dy * 0.02 * mult * (rainT > 0 ? 2 : 1) * (VH.score || 1);

    const steer = VEHICLES[vehicle].steer * (rainT > 0 ? 0.6 : 1);
    player.y = H - player.h - Math.max(70, H * 0.12);
    player.x += (player.tx - player.x) * Math.min(1, dt * steer);
    player.tilt *= Math.pow(0.02, dt);
    if (player.wobble > 0) player.wobble = Math.max(0, player.wobble - dt);

    // toll plazas on Lekki: normal traffic pauses before each plaza so a clear green lane is always reachable
    let tollSoon = false;
    if (R.junctions) {
      junctionGap -= dy;
      if (junctionGap < road.lane * 7) tollSoon = true;
      if (junctionGap <= 0) { spawnJunction(); junctionGap = road.lane * rnd(24, 32); spawnGap = road.lane * 3; }
    }
    if (R.works) {
      worksGap -= dy;
      if (worksGap < road.lane * 6) tollSoon = true;
      if (worksGap <= 0) { spawnWorks(); worksGap = road.lane * rnd(22, 30); spawnGap = road.lane * 1.5; }
    }
    if (R.rain) {
      if (rainT > 0) { rainT -= dt; if (rainT <= 0) { toast('Rain don stop'); rainTimer = rnd(9, 14); } }
      else { rainTimer -= dt; if (rainTimer <= 0) { rainT = 7; toast('Rain! Double points'); Sound.rain(7); } }
    }
    if (R.convoys) {
      if (convoyWarn) { convoyWarn.t -= dt; if (convoyWarn.t <= 0) { spawnConvoy(convoyWarn.lane); convoyWarn = null; } }
      else { convoyTimer -= dt; if (convoyTimer <= 0) { startConvoy(); convoyTimer = rnd(11, 16) * (level === 'expert' ? 0.75 : level === 'novice' ? 1.4 : 1); } }
    }
    if (R.planes) {
      planeTimer -= dt;
      if (planeTimer <= 0) { scene.props.push({ type: 'plane', x: rnd(0.25, 0.75) * W, y: -220, rel: 0.45, drift: rnd(-30, 30), s: rnd(0.9, 1.2) }); Sound.plane(); planeTimer = rnd(12, 18); }
    }
    if (R.toll) {
      tollGap -= dy;
      if (tollGap < road.lane * 9) tollSoon = true;
      if (tollGap <= 0) { spawnToll(); tollGap = road.lane * rnd(26, 34); spawnGap = road.lane * 3.2; }
    }
    spawnGap -= dy;
    if (spawnGap <= 0 && !tollSoon) {
      spawnRow();
      const difficulty = Math.min(1, t / 90);
      spawnGap = (road.lane * (3.6 - difficulty * 1.5) + Math.random() * road.lane * 1.4) * LV.gap * R.gap;
    }
    if (R.hawkers) {
      hawkerTimer -= dt;
      if (hawkerTimer <= 0) { spawnHawker(); hawkerTimer = rnd(5, 9) * (level === 'expert' ? 0.75 : level === 'novice' ? 1.4 : 1); }
    }

    for (const o of obstacles) {
      o.y += dy * o.rel;
      if (o.kind === 'okada' || o.kind === 'keke') {
        o.phase += dt * 3;
        const weaveRate = o.kind === 'okada' ? LV.weave : LV.weave * 0.5;
        if (!o.weaved && o.y > H * 0.05 && o.y < H * 0.35 && Math.random() < dt * weaveRate) {
          const d = Math.random() < .5 ? -1 : 1, n = o.lane + d;
          if (n >= 0 && n < LANES && !obstacles.some(p => p !== o && p.kind !== 'plaza' && p.lane === n && Math.abs(p.y - o.y) < road.lane * 1.8)) { o.weaved = true; o.lane = n; }
        }
        o.x += (laneX(o.lane) - o.x) * Math.min(1, dt * 3.2) + (o.kind === 'okada' ? Math.sin(o.phase) * 0.25 : 0);
      }
      if (o.kind === 'hawker') { o.x += o.vx * dt; o.phase += dt * 8; }
      if (o.parked && o.y > H * 0.12) { o.parked = false; o.pulling = true; }
      if (o.pulling) { o.rel += (o.target - o.rel) * Math.min(1, dt * 1.5); o.x += (laneX(o.lane) - o.x) * Math.min(1, dt * 2.5); }
      if (o.kind === 'crosser') {
        if (!o.moving && o.y > H * 0.08) { o.moving = true; o.vx = o.dir * (road.w + 2 * EDGE + 120) / rnd(1.5, 2.0); }
        if (o.moving) o.x += o.vx * dt;
      }
    }
    // traffic that reaches a plaza drives through an open booth rather than overlapping the barrier
    for (const p of obstacles) if (p.kind === 'plaza') {
      for (const o of obstacles) if (o.rel < 1 && p.closed.includes(o.lane) && o.y + o.h > p.y && o.y < p.y + p.h) {
        const open = [0, 1, 2, 3].filter(l => !p.closed.includes(l));
        o.lane = open.reduce((a, l) => Math.abs(l - o.lane) < Math.abs(a - o.lane) ? l : a, open[0]);
        o.x += (laneX(o.lane) - o.x) * 0.3;
      }
    }

    // traffic merges out of a lane closed for road works
    for (const wk of obstacles) if (wk.kind === 'works') {
      for (const o of obstacles) if (['car', 'danfo', 'keke', 'okada', 'bus'].includes(o.kind) && o.lane === wk.lane && o.y + o.h > wk.y - road.lane * 0.5 && o.y < wk.y + wk.h) {
        const opts = [o.lane - 1, o.lane + 1].filter(l => l >= 0 && l < LANES);
        o.lane = pick(opts);
      }
    }
    // the convoy pushes ordinary traffic out of its lane
    for (const c of obstacles) if (c.kind === 'convoy') {
      for (const o of obstacles) if (['car', 'danfo', 'keke', 'okada', 'bus'].includes(o.kind) && o.lane === c.lane && o.y + o.h > c.y - road.lane && o.y < c.y + c.h) {
        const opts = [o.lane - 1, o.lane + 1].filter(l => l >= 0 && l < LANES);
        o.lane = pick(opts); o.parked = false;
      }
    }
    for (const o of obstacles) if (['car', 'danfo', 'bus'].includes(o.kind) && !o.parked && Math.abs(o.x - laneX(o.lane)) > 1) o.x += (laneX(o.lane) - o.x) * Math.min(1, dt * 3);

    for (const o of obstacles) {
      if (o.kind === 'junction') {
        if (!o.counted && o.y > player.y + player.h) { o.counted = true; score += 30 * mult; toast('Junction cleared +' + 30 * mult); Sound.toll(); }
        continue;
      }
      if (o.kind === 'plaza') continue;
      if (o.kind === 'convoy') {
        const px = player.x, py = player.y + player.h / 2, oy = o.y + o.h / 2;
        if (Math.abs(px - o.x) < (player.w + o.w) / 2 * 0.82 && Math.abs(py - oy) < (player.h + o.h) / 2 * 0.85) { crash(o); return; }
        if (!o.counted && o.y + o.h < player.y) { o.counted = true; if (o.last) { score += 40 * mult; toast('Convoy dodged +' + 40 * mult); Sound.streak(); } }
        continue;
      }
      const px = player.x, py = player.y + player.h / 2, ox = o.x, oy = o.y + o.h / 2;
      const ix = (player.w + o.w) / 2 * 0.82, iy = (player.h + o.h) / 2 * 0.85;
      if (Math.abs(px - ox) < ix && Math.abs(py - oy) < iy) {
        if (o.kind === 'pothole') {
          const ph = VH.pothole || 'normal';
          if (ph === 'crash') { crash(o); return; }
          if (!o.hit) {
            o.hit = true;
            if (ph === 'immune') { player.wobble = 0.25; toast('SUV no send pothole'); Sound.pothole(); }
            else { const cost = ph === 'double' ? 100 : 50; score = Math.max(0, score - cost); mult = 1; cleanStreak = 0; player.wobble = 0.5; shake = 6; toast('Pothole! Streak lost'); Sound.pothole(); }
          }
        } else { crash(o); return; }
      }
      if (!o.counted && o.y > player.y + player.h) {
        o.counted = true;
        if (o.kind === 'barrier') {
          if (!o.plaza.cleared) { o.plaza.cleared = true; score += 50 * mult; toast('Toll cleared +' + 50 * mult); Sound.toll(); }
        } else if (o.kind === 'works') {
          score += 20 * mult; toast('Road works cleared +' + 20 * mult); Sound.toll();
        } else if (o.kind === 'hawker') {
          // no points for passing people
        } else if (o.kind !== 'pothole' || !o.hit || VEHICLES[vehicle].pothole === 'immune') {
          if (o.kind !== 'pothole') { passed++; Sound.pass(); }
          cleanStreak++;
          score += 10 * mult;
          if (cleanStreak % 8 === 0 && mult < 5) { mult++; toast('Streak x' + mult); Sound.streak(); }
        }
      }
    }
    obstacles = obstacles.filter(o => o.y < H + 240 && o.y > -500 &&
      (o.kind !== 'hawker' || (o.x > road.x - 40 && o.x < road.x + road.w + 40)) &&
      (o.kind !== 'crosser' || !o.moving || (o.x > -120 && o.x < W + 120)));
    for (const p of scene.props) if (p.type === 'plane') p.x += p.drift * dt;
    updateScene(dy);
    if (shake > 0) shake = Math.max(0, shake - dt * 40);
    updateHud();
  }

  // ---------- drawing helpers ----------
  function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
  function shadow(x, y, w, h, r) { ctx.fillStyle = 'rgba(0,0,0,0.30)'; rr(x + 3, y + 5, w, h, r); ctx.fill(); }

  // ---------- scenes ----------
  function drawSides() {
    const lw = sideW(), rx = road.x + road.w + EDGE, rw = W - rx;
    if (route === 'tmb') {
      ctx.fillStyle = '#2A79B8'; ctx.fillRect(0, 0, W, H);
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(255,214,140,0.22)'); g.addColorStop(0.6, 'rgba(255,214,140,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (const r of scene.ripples) { const x = r.side === 0 ? r.x * lw : rx + r.x * rw; ctx.beginPath(); ctx.moveTo(x, r.y); ctx.lineTo(x + r.l, r.y); ctx.stroke(); }
      for (const p of scene.props) drawProp(p, lw, rx, rw);
      return;
    }
    const ground = { ikoyi: '#5E7F48', lekki: '#D9C79A', cms: '#3E3A36', oshodi: '#2E2A26', surulere: '#BDB39F', ikeja: '#8F8A82', vi: '#2F3A45' }[route];
    const pave = { ikoyi: '#A39E93', cms: '#9C978D', oshodi: '#58524A', surulere: '#A39E93', ikeja: '#9C978D', vi: '#7D8792' }[route];
    ctx.fillStyle = ground; ctx.fillRect(0, 0, W, H);
    for (const side of [0, 1]) for (const b of scene.blocks[side]) drawBlock(b, side === 0 ? 0 : rx, side === 0 ? lw : rw, side);
    // pavement strip beside the kerb
    if (route !== 'lekki') { ctx.fillStyle = pave; ctx.fillRect(lw - 14, 0, 14, H); ctx.fillRect(rx, 0, 14, H); }
    else { ctx.fillStyle = '#7FA650'; ctx.fillRect(lw - 10, 0, 10, H); ctx.fillRect(rx, 0, 10, H); }
    for (const p of scene.props) drawProp(p, lw, rx, rw);
  }

  function drawBlock(b, x0, w, side) {
    const inner = side === 0 ? x0 : x0 + 14, bw = w - 14;
    if (route === 'ikoyi') {
      // walled compound with a lawn, a big house and sometimes a pool
      ctx.fillStyle = b.wall; ctx.fillRect(inner, b.y + 2, bw, b.h - 4);
      ctx.fillStyle = b.color; ctx.fillRect(inner + 4, b.y + 6, bw - 8, b.h - 12);
      ctx.fillStyle = b.roof; ctx.fillRect(inner + bw * 0.16, b.y + b.h * 0.12, bw * 0.68, b.h * 0.42);
      ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(inner + bw * 0.16, b.y + b.h * 0.32, bw * 0.68, 2);
      if (b.pool) { ctx.fillStyle = '#4FB3D9'; rr(inner + bw * 0.28, b.y + b.h * 0.64, bw * 0.44, b.h * 0.18, 4); ctx.fill(); ctx.strokeStyle = '#E8E2D4'; ctx.lineWidth = 2; ctx.stroke(); }
    } else if (route === 'surulere') {
      // painted bungalow with a corrugated roof
      ctx.fillStyle = b.color; ctx.fillRect(inner, b.y + 2, bw, b.h - 4);
      ctx.fillStyle = b.roof; ctx.fillRect(inner + bw * 0.12, b.y + b.h * 0.14, bw * 0.76, b.h * 0.72);
      ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1;
      for (let x = inner + bw * 0.12 + 4; x < inner + bw * 0.88; x += 5) { ctx.beginPath(); ctx.moveTo(x, b.y + b.h * 0.14); ctx.lineTo(x, b.y + b.h * 0.86); ctx.stroke(); }
      if (b.fence) { ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.strokeRect(inner + 3, b.y + 5, bw - 6, b.h - 10); }
    } else if (route === 'ikeja') {
      ctx.fillStyle = b.color; ctx.fillRect(inner + 2, b.y + 2, bw - 4, b.h - 4);
      ctx.fillStyle = b.sign; const sx = side === 0 ? inner + bw - 9 : inner + 1; ctx.fillRect(sx, b.y + 8, 8, b.h - 16);
      ctx.fillStyle = '#8D9096'; for (let i = 0; i < b.units; i++) ctx.fillRect(inner + 12 + i * 13, b.y + 14, 8, 8);
    } else if (route === 'vi') {
      // glass tower
      ctx.fillStyle = b.color; ctx.fillRect(inner + 2, b.y + 2, bw - 4, b.h - 4);
      ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 1;
      for (let x = inner + 10; x < inner + bw - 4; x += 10) { ctx.beginPath(); ctx.moveTo(x, b.y + 4); ctx.lineTo(x, b.y + b.h - 4); ctx.stroke(); }
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.beginPath(); ctx.moveTo(inner + 4, b.y + b.h * 0.7); ctx.lineTo(inner + bw * 0.6, b.y + 4); ctx.lineTo(inner + bw * 0.8, b.y + 4); ctx.lineTo(inner + 4, b.y + b.h * 0.95); ctx.closePath(); ctx.fill();
      if (b.pad) { ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(inner + bw / 2, b.y + b.h / 2, Math.min(bw, b.h) * 0.22, 0, Math.PI * 2); ctx.stroke(); ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('H', inner + bw / 2, b.y + b.h / 2); }
    } else if (route === 'lekki') {
      // compound wall with a house and roof
      ctx.fillStyle = b.color; ctx.fillRect(inner, b.y, bw, b.h - 4);
      ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fillRect(inner, b.y + b.h - 6, bw, 2);
      if (b.house) { ctx.fillStyle = b.roof; ctx.fillRect(inner + bw * 0.18, b.y + b.h * 0.2, bw * 0.64, b.h * 0.5); ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(inner + bw * 0.18, b.y + b.h * 0.45, bw * 0.64, 2); }
    } else if (route === 'cms') {
      ctx.fillStyle = b.color; ctx.fillRect(inner + 2, b.y + 2, bw - 4, b.h - 4);
      ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(inner + 6, b.y + 6, bw - 12, b.h - 12);
      ctx.fillStyle = '#B9BCC1';
      for (let i = 0; i < b.units; i++) ctx.fillRect(inner + 10 + i * 14, b.y + 12, 9, 9);
      if (b.pad) { ctx.strokeStyle = 'rgba(250,194,6,0.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(inner + bw / 2, b.y + b.h / 2, Math.min(bw, b.h) * 0.22, 0, Math.PI * 2); ctx.stroke(); }
    } else {
      // market stall: table with an umbrella
      ctx.fillStyle = b.table; ctx.fillRect(inner + 4, b.y + 4, bw - 8, b.h - 8);
      const cx = inner + bw / 2, cy = b.y + b.h / 2, r = Math.min(bw, b.h) * 0.48;
      for (let i = 0; i < 6; i++) { ctx.fillStyle = i % 2 ? b.color : '#F2F2F2'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, i * Math.PI / 3, (i + 1) * Math.PI / 3); ctx.closePath(); ctx.fill(); }
    }
  }

  function drawProp(p, lw, rx, rw) {
    if (p.type === 'canoe') {
      const x = p.side === 0 ? p.x * lw : rx + p.x * rw;
      ctx.save(); ctx.translate(x, p.y); ctx.rotate(p.ang);
      ctx.fillStyle = '#6B4226'; ctx.beginPath(); ctx.ellipse(0, 0, 6, p.len / 2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8B5A33'; ctx.beginPath(); ctx.ellipse(0, 0, 3.5, p.len / 2 - 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(0, -4, 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (p.type === 'palm') {
      const x = p.side === 0 ? lw - 22 : rx + 22;
      ctx.save(); ctx.translate(x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.arc(4, 5, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2E7D32';
      for (let i = 0; i < 7; i++) { ctx.rotate(Math.PI * 2 / 7); ctx.beginPath(); ctx.ellipse(p.r * 0.55, 0, p.r * 0.55, p.r * 0.18, 0, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = '#6B4226'; ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, Math.PI * 2); ctx.fill();

    const on = Math.floor(performance.now() / 150) % 2 === 0;
    ctx.fillStyle = on ? C.red : '#2F6BD8'; ctx.fillRect(x - w * 0.32, y + h * 0.44, w * 0.3, 5);
    ctx.fillStyle = on ? '#2F6BD8' : C.red; ctx.fillRect(x + w * 0.02, y + h * 0.44, w * 0.3, 5);
    ctx.fillStyle = '#FFF4C2'; ctx.fillRect(x - w / 2 + 3, y + 1, 6, 3); ctx.fillRect(x + w / 2 - 9, y + 1, 6, 3);
  }
  function drawConvoyWarning() {
    if (!convoyWarn) return;
    const x = laneX(convoyWarn.lane), on = Math.floor(performance.now() / 180) % 2 === 0;
    ctx.save(); ctx.globalAlpha = 0.85;
    for (let i = 0; i < 3; i++) {
      const y = H - 40 - i * 34;
      ctx.fillStyle = (i % 2 === 0) === on ? C.red : '#2F6BD8';
      ctx.beginPath(); ctx.moveTo(x, y - 16); ctx.lineTo(x + 16, y); ctx.lineTo(x + 8, y); ctx.lineTo(x, y - 8); ctx.lineTo(x - 8, y); ctx.lineTo(x - 16, y); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  function drawPlaneShadow(p) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(p.s, p.s); ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(0, 0, 14, 95, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6, -15); ctx.lineTo(-120, 25); ctx.lineTo(-120, 38); ctx.lineTo(-6, 15); ctx.lineTo(6, 15); ctx.lineTo(120, 38); ctx.lineTo(120, 25); ctx.lineTo(6, -15); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-4, 60); ctx.lineTo(-42, 88); ctx.lineTo(-42, 96); ctx.lineTo(0, 84); ctx.lineTo(42, 96); ctx.lineTo(42, 88); ctx.lineTo(4, 60); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function drawBarrier(o) {
    const { x, y, w, h } = o;
    const segs = 6, sw = w / segs;
    for (let i = 0; i < segs; i++) { ctx.fillStyle = i % 2 ? '#FFFFFF' : C.red; ctx.fillRect(x - w / 2 + i * sw, y + h * 0.3, sw, h * 0.4); }
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.strokeRect(x - w / 2, y + h * 0.3, w, h * 0.4);
  }

  function drawObstacle(o) {
    switch (o.kind) {
      case 'car': drawCar(o); break;
      case 'danfo': drawDanfo(o.x, o.y, o.w, o.h, '#A8841F', false); break;
      case 'keke': drawKeke(o.x, o.y, o.w, o.h, '#2E7D4F', '#FAC206', false); break;
      case 'bus': drawBus(o); break;
      case 'okada': drawOkada(o); break;
      case 'breakdown': drawBreakdown(o); break;
      case 'barrier': drawBarrier(o); break;
      case 'hawker': drawHawker(o); break;
      case 'crosser': drawCrosser(o); break;
      case 'convoy': drawConvoy(o); break;
      case 'works': drawWorks(o); break;
    }
  }
  function drawPlayer() {
    ctx.save();
    const wob = player.wobble > 0 ? Math.sin(player.wobble * 40) * 0.08 : 0;
    ctx.translate(player.x, player.y + player.h / 2); ctx.rotate(player.tilt + wob); ctx.translate(-player.x, -(player.y + player.h / 2));
    if (vehicle === 'keke') drawKeke(player.x, player.y, player.w, player.h, C.yellow, '#000', true);
    else if (vehicle === 'powerbike') drawPowerbike(player.x, player.y, player.w, player.h);
    else if (vehicle === 'suv') drawSUV(player.x, player.y, player.w, player.h);
    else if (vehicle === 'sportcar') drawSportcar(player.x, player.y, player.w, player.h);
    else drawDanfo(player.x, player.y, player.w, player.h, C.yellow, true);
    ctx.restore();
  }

  // ---------- lighting ----------
  function drawLighting() {
    const R = ROUTES[route];
    if (route === 'cms') {
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(255,150,40,0.20)'); g.addColorStop(1, 'rgba(255,120,40,0.04)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    } else if (route === 'lekki') {
      ctx.fillStyle = 'rgba(255,255,230,0.06)'; ctx.fillRect(0, 0, W, H);
    } else if (route === 'ikeja') {
      ctx.fillStyle = 'rgba(255,255,240,0.05)'; ctx.fillRect(0, 0, W, H);
      for (const p of scene.props) if (p.type === 'plane') drawPlaneShadow(p);
    } else if (route === 'vi') {
      ctx.fillStyle = 'rgba(30,50,120,0.30)'; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let y = -140 + scene.posts; y < H + 20; y += 140) {
        const x = road.x - EDGE + 27; const lg = ctx.createRadialGradient(x, y + 4, 0, x, y + 4, 55); lg.addColorStop(0, 'rgba(255,200,110,0.28)'); lg.addColorStop(1, 'rgba(255,200,110,0)'); ctx.fillStyle = lg; ctx.fillRect(x - 55, y - 51, 110, 110);
      }
      ctx.restore();
      drawConvoyWarning();
    }
    if (!R.night) return;
    ctx.fillStyle = 'rgba(6,10,28,0.62)'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    // headlight cone from the player
    const hx = player.x, hy = player.y;
    const g = ctx.createRadialGradient(hx, hy, 4, hx, hy - road.lane * 2.4, road.lane * 3);
    g.addColorStop(0, 'rgba(255,240,190,0.45)'); g.addColorStop(1, 'rgba(255,240,190,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(hx - player.w * 0.35, hy); ctx.lineTo(hx - road.lane * 1.1, hy - road.lane * 4.2); ctx.lineTo(hx + road.lane * 1.1, hy - road.lane * 4.2); ctx.lineTo(hx + player.w * 0.35, hy); ctx.closePath(); ctx.fill();
    // tail lights
    for (const o of obstacles) {
      if (!['car', 'danfo', 'bus', 'keke', 'breakdown'].includes(o.kind)) continue;
      for (const sx of [-1, 1]) { const x = o.x + sx * (o.w / 2 - 6), y = o.y + o.h - 2; const tg = ctx.createRadialGradient(x, y, 0, x, y, 16); tg.addColorStop(0, 'rgba(255,60,40,0.55)'); tg.addColorStop(1, 'rgba(255,60,40,0)'); ctx.fillStyle = tg; ctx.fillRect(x - 16, y - 16, 32, 32); }
    }
    // stall lamps and street lights
    const lw = sideW(), rx = road.x + road.w + EDGE, rw = W - rx;
    for (const p of scene.props) if (p.type === 'lamp') {
      const x = p.side === 0 ? p.x * lw : rx + p.x * rw;
      const lg = ctx.createRadialGradient(x, p.y, 0, x, p.y, 46); lg.addColorStop(0, 'rgba(' + p.hue + ',0.65)'); lg.addColorStop(1, 'rgba(' + p.hue + ',0)');
      ctx.fillStyle = lg; ctx.fillRect(x - 46, p.y - 46, 92, 92);
    }
    for (let y = -140 + scene.posts; y < H + 20; y += 140) {
      const x = road.x - EDGE + 27; const lg = ctx.createRadialGradient(x, y + 4, 0, x, y + 4, 60); lg.addColorStop(0, 'rgba(255,200,110,0.35)'); lg.addColorStop(1, 'rgba(255,200,110,0)'); ctx.fillStyle = lg; ctx.fillRect(x - 60, y - 56, 120, 120);
    }
    ctx.restore();
    // the player sits in its own light, so redraw it slightly dimmed on top of the darkness
    ctx.save(); ctx.globalAlpha = 0.8; drawPlayer(); ctx.restore();
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    drawSides();
    drawRoad();
    const sorted = obstacles.slice().sort((a, b) => a.y - b.y);
    for (const o of sorted) if (o.kind === 'junction') drawJunction(o);
    for (const o of sorted) if (o.kind === 'plaza') drawPlazaFloor(o);
    for (const o of sorted) if (o.kind === 'pothole') drawPothole(o);
    for (const o of sorted) if (o.kind === 'works') drawWorks(o);
    for (const o of sorted) if (o.kind !== 'pothole' && o.kind !== 'plaza' && o.kind !== 'junction' && o.kind !== 'works') drawObstacle(o);
    drawConvoyWarning();
    drawPlayer();
    for (const o of sorted) if (o.kind === 'plaza') drawPlazaRoof(o);
    drawLighting();
    if (route === 'ikoyi') drawRain();
    ctx.restore();
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (state === 'play') update(dt);
    else if (state === 'menu') { updateScene(140 * dt); player.y = H - player.h - Math.max(70, H * 0.12); }
    else if (shake > 0) shake = Math.max(0, shake - dt * 40);
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize(); reset(); resize();
  renderMenu();
  show('start');
  requestAnimationFrame(frame);
})();
</script>
</body>
